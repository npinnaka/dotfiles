# Starship Configuration

# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

# Inserts a blank line between shell prompts
add_newline = true

# Replace the "❯" symbol in the prompt with "➜"
[character]
success_symbol = "[➜](bold green)"
error_symbol = "[➜](bold red)"

# Disable the package module, as it's often slow
[package]
disabled = true

# Git configuration
[git_branch]
symbol = " "
style = "bold purple"

[git_status]
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
conflicted = ""
deleted = ""
renamed = ""
modified = ""
staged = ""
untracked = ""
style = "bold yellow"

# Directory
[directory]
truncation_length = 3
truncate_to_repo = true
style = "bold cyan"

# Battery (show if low)
[battery]
full_symbol = "󰁹 "
charging_symbol = "󰂄 "
discharging_symbol = "󰂃 "

[[battery.display]]
threshold = 10
style = "bold red"
