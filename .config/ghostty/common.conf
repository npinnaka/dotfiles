# Ghostty Common Configuration (Shared across macOS and Linux)

# Theme
theme = light:Catppuccin Latte,dark:Catppuccin Mocha

# Font
font-family = "JetBrainsMono Nerd Font"
font-size = 13

# Window
background-opacity = 0.9
window-padding-x = 10
window-padding-y = 8

# Cursor
cursor-style = block
cursor-style-blink = true

# Mouse
mouse-hide-while-typing = true
cursor-click-to-move = true

# Shell integration
shell-integration-features = cursor,sudo,title

# Keybindings for Home and End keys
# Send physical Home/End escape sequences to the terminal
keybind = home=text:\x1b[H
keybind = end=text:\x1b[F

# Copy on select
copy-on-select = true
